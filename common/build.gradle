plugins {
    id 'java-library'
}

group = project.maven_group
version = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Exposed in this module's own signatures (Challenge, RunSnapshot, RunState),
    // so consumers get core transitively rather than having to restate it.
    api project(':core')

    // Adapters already log through SLF4J on both platforms: Fabric directly,
    // Paper through JavaPlugin.getSLF4JLogger().
    api 'org.slf4j:slf4j-api:2.0.16'

    // Reading and writing the per-player display config. Not exposed in the
    // public API, and both platforms bundle Gson at runtime, so neither jar
    // carries a copy.
    implementation 'com.google.code.gson:gson:2.13.1'

    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// The website reads this to mark the pieces a platform does not run. Re-run
// after changing what any adapter supports; the result is committed alongside
// the site, like the catalog and the game data.
def webSupport = rootProject.file('web/assets/js/support.js')

tasks.register('exportSupport', JavaExec) {
    group = 'build'
    description = 'Regenerates the web builder platform-support file.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.basinity.challengex.common.support.SupportExportMain'
    args webSupport.absolutePath
    inputs.files(sourceSets.main.output)
    outputs.file(webSupport)
}
