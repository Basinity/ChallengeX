plugins {
    id 'java'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = "challengex-paper-${sc.current.version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${project.paper_api_version}"

    implementation project(':core')
    implementation project(':common')

    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The handler-coverage test reads the registration table only; it never
    // touches Bukkit, so the API is enough and no server is needed.
    testCompileOnly "io.papermc.paper:paper-api:${project.paper_api_version}"
    testRuntimeOnly "io.papermc.paper:paper-api:${project.paper_api_version}"
}

test {
    useJUnitPlatform()
}

processResources {
    // Read here rather than inside the closure below. Reaching for the project
    // from a task at execution time is deprecated, fails outright in Gradle 10,
    // and rules out the configuration cache.
    def pluginVersion = project.version
    def minecraftVersion = sc.current.version

    inputs.property 'version', pluginVersion
    inputs.property 'minecraft', minecraftVersion

    filesMatching('paper-plugin.yml') {
        expand 'version': pluginVersion, 'minecraft': minecraftVersion
    }
}

// Paper has no jar-in-jar, so core and common ride inside the plugin jar as
// plain classes. Gson and SLF4J stay out of it: the server bundles both
// already, the same reason the fabric jar nests nothing extra for them.
jar {
    from project(':core').sourceSets.main.output
    from project(':common').sourceSets.main.output
}
